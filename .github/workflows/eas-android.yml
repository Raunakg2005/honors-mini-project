name: Build Android APK and AAB

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Validate EXPO_TOKEN
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Missing EXPO_TOKEN secret. Add it in: Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: Install Dependencies
        run: npm ci

      - name: Build APK (Preview Profile) and Download
        run: |
          mkdir -p dist
          eas build --platform android --profile preview --non-interactive --wait --json > apk-build.json
          APK_URL=$(node -e "const fs=require('fs');const raw=fs.readFileSync('apk-build.json','utf8');const data=JSON.parse(raw);const build=Array.isArray(data)?data[0]:data;const url=build?.artifacts?.buildUrl||'';if(!url){console.error('No APK artifact URL found in build JSON');process.exit(1);}process.stdout.write(url);")
          curl -L "$APK_URL" -o dist/app-preview.apk

      - name: Build AAB (Production Profile) and Download
        run: |
          eas build --platform android --profile production --non-interactive --wait --json > aab-build.json
          AAB_URL=$(node -e "const fs=require('fs');const raw=fs.readFileSync('aab-build.json','utf8');const data=JSON.parse(raw);const build=Array.isArray(data)?data[0]:data;const url=build?.artifacts?.buildUrl||'';if(!url){console.error('No AAB artifact URL found in build JSON');process.exit(1);}process.stdout.write(url);")
          curl -L "$AAB_URL" -o dist/app-production.aab

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-preview
          path: dist/app-preview.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-production
          path: dist/app-production.aab
